<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搞怪抽奖大转盘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', '微软雅黑', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        h1 {
            color: #ff6b6b;
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0 #ffd166;
            transform: rotate(-2deg);
            animation: titleBounce 2s infinite alternate;
        }
        
        .subtitle {
            color: #06d6a0;
            font-size: 1.5rem;
            margin-bottom: 30px;
            transform: rotate(1deg);
        }
        
        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 0 auto 30px;
        }
        
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #ff9a9e 0deg 45deg,
                #ffd166 45deg 90deg,
                #06d6a0 90deg 135deg,
                #118ab2 135deg 180deg,
                #073b4c 180deg 225deg,
                #ef476f 225deg 270deg,
                #7209b7 270deg 315deg,
                #f15bb5 315deg 360deg
            );
            position: relative;
            transition: transform 4s cubic-bezier(0.2, 0.8, 0.3, 1);
            box-shadow: 0 0 0 10px #ffd166, 0 0 20px rgba(0,0,0,0.3);
        }
        
        .wheel-section {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: bottom right;
            left: 0;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding-left: 40px;
        }
        
        .wheel-text {
            color: white;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            transform: rotate(45deg);
        }
        
        .pointer {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 60px;
            background: #ff6b6b;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            z-index: 10;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3));
        }
        
        .spin-button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 0 #ff4757;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        
        .spin-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #ff4757;
        }
        
        .spin-button:active {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #ff4757;
        }
        
        .spin-button:before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: 0.5s;
        }
        
        .spin-button:hover:before {
            left: 100%;
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #06d6a0;
            border-radius: 15px;
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: scale(0);
            transition: transform 0.5s;
        }
        
        .result.show {
            transform: scale(1);
        }
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ff6b6b;
            top: 0;
            opacity: 0;
        }
        
        @keyframes titleBounce {
            0% { transform: rotate(-2deg) scale(1); }
            100% { transform: rotate(-2deg) scale(1.05); }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes wobble {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .funny-face {
            position: absolute;
            font-size: 2rem;
            opacity: 0;
            z-index: 5;
        }
        
        .instructions {
            margin-top: 20px;
            color: #666;
            font-style: italic;
        }
        
        .counter {
            font-size: 1.2rem;
            margin-top: 10px;
            color: #ff6b6b;
            font-weight: bold;
        }
        
        /* 响应式设计 */
        @media (max-width: 600px) {
            .wheel-container {
                width: 300px;
                height: 300px;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>搞怪抽奖大转盘</h1>
        <p class="subtitle">试试你的运气，收获意想不到的"惊喜"！</p>
        
        <div class="wheel-container">
            <div class="pointer"></div>
            <div class="wheel" id="wheel">
                <!-- 转盘区域将通过JavaScript生成 -->
            </div>
        </div>
        
        <button class="spin-button" id="spinButton">开始抽奖</button>
        
        <div class="result" id="result">等待开奖...</div>
        
        <p class="instructions">点击按钮开始抽奖，看看你能抽到什么搞怪奖品！</p>
        <p class="counter" id="counter">今日已抽奖: <span id="count">0</span> 次</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const wheel = document.getElementById('wheel');
            const spinButton = document.getElementById('spinButton');
            const result = document.getElementById('result');
            const countElement = document.getElementById('count');
            
            // 搞笑的奖品选项
            const prizes = [
                "老板的鼓励微笑",
                "空气奖励一份",
                "加班一小时体验券",
                "再来一次机会",
                "免费摸鱼五分钟",
                "老板的拍肩鼓励",
                "全公司通报表扬",
                "本月最佳员工提名"
            ];
            
            // 初始化转盘
            function initWheel() {
                wheel.innerHTML = '';
                const angle = 360 / prizes.length;
                
                prizes.forEach((prize, index) => {
                    const section = document.createElement('div');
                    section.className = 'wheel-section';
                    section.style.transform = `rotate(${index * angle}deg)`;
                    
                    const text = document.createElement('div');
                    text.className = 'wheel-text';
                    text.textContent = prize;
                    section.appendChild(text);
                    
                    wheel.appendChild(section);
                });
            }
            
            // 创建五彩纸屑效果
            function createConfetti() {
                const colors = ['#ff6b6b', '#ffd166', '#06d6a0', '#118ab2', '#7209b7', '#f15bb5'];
                
                for (let i = 0; i < 100; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animation = `fall ${Math.random() * 3 + 2}s linear forwards`;
                    
                    document.body.appendChild(confetti);
                    
                    // 设置动画
                    confetti.style.animation = `fall ${Math.random() * 3 + 2}s linear forwards`;
                    
                    // 动画结束后移除元素
                    setTimeout(() => {
                        confetti.remove();
                    }, 5000);
                }
                
                // 添加CSS动画
                const style = document.createElement('style');
                style.textContent = `
                    @keyframes fall {
                        0% {
                            top: -20px;
                            opacity: 1;
                            transform: rotate(0deg);
                        }
                        100% {
                            top: 100vh;
                            opacity: 0;
                            transform: rotate(${Math.random() * 360}deg);
                        }
                    }
                `;
                document.head.appendChild(style);
            }
            
            // 创建滑稽表情
            function createFunnyFaces() {
                const faces = ['😜', '🤪', '😝', '🤑', '🤡', '👻', '💩', '🤖'];
                
                for (let i = 0; i < 10; i++) {
                    const face = document.createElement('div');
                    face.className = 'funny-face';
                    face.textContent = faces[Math.floor(Math.random() * faces.length)];
                    face.style.left = Math.random() * 90 + 5 + '%';
                    face.style.top = Math.random() * 90 + 5 + '%';
                    face.style.fontSize = (Math.random() * 2 + 1.5) + 'rem';
                    
                    document.querySelector('.container').appendChild(face);
                    
                    // 设置动画
                    face.style.animation = `wobble ${Math.random() * 2 + 1}s infinite, appear 0.5s forwards`;
                    
                    // 动画结束后移除
                    setTimeout(() => {
                        face.style.animation = 'disappear 0.5s forwards';
                        setTimeout(() => {
                            face.remove();
                        }, 500);
                    }, 2000);
                }
                
                // 添加CSS动画
                const style = document.createElement('style');
                style.textContent = `
                    @keyframes appear {
                        0% { opacity: 0; transform: scale(0); }
                        100% { opacity: 1; transform: scale(1); }
                    }
                    @keyframes disappear {
                        0% { opacity: 1; transform: scale(1); }
                        100% { opacity: 0; transform: scale(0); }
                    }
                `;
                document.head.appendChild(style);
            }
            
            // 抽奖函数
            function spinWheel() {
                // 禁用按钮
                spinButton.disabled = true;
                
                // 更新抽奖次数
                let count = parseInt(countElement.textContent);
                countElement.textContent = count + 1;
                
                // 随机决定旋转圈数和最终位置
                const spins = 5 + Math.floor(Math.random() * 5); // 5-10圈
                const randomPrize = Math.floor(Math.random() * prizes.length);
                const angle = 360 - (randomPrize * (360 / prizes.length)) - (360 / prizes.length / 2);
                const totalRotation = spins * 360 + angle;
                
                // 应用旋转
                wheel.style.transform = `rotate(${totalRotation}deg)`;
                
                // 显示结果
                setTimeout(() => {
                    result.textContent = `恭喜你获得了: ${prizes[randomPrize]}！`;
                    result.classList.add('show');
                    
                    // 创建庆祝效果
                    createConfetti();
                    createFunnyFaces();
                    
                    // 播放音效（模拟）
                    playSoundEffect();
                    
                    // 重新启用按钮
                    setTimeout(() => {
                        spinButton.disabled = false;
                    }, 3000);
                }, 4000);
            }
            
            // 模拟音效
            function playSoundEffect() {
                // 在实际应用中，这里会播放音频文件
                // 为了演示，我们只是创建一个振荡器来产生简单的音效
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.type = 'sine';
                    oscillator.frequency.value = 300;
                    gainNode.gain.value = 0.1;
                    
                    oscillator.start();
                    
                    // 音高变化
                    oscillator.frequency.exponentialRampToValueAtTime(800, audioContext.currentTime + 0.2);
                    
                    // 淡出
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                    
                    setTimeout(() => {
                        oscillator.stop();
                    }, 500);
                } catch (e) {
                    console.log("音频上下文不支持");
                }
            }
            
            // 初始化
            initWheel();
            
            // 绑定事件
            spinButton.addEventListener('click', spinWheel);
        });
    </script>
</body>
</html>
